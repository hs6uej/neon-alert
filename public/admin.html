<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON ALERT — Admin</title>
<style>
  :root { --bg:#05080d; --panel:#0b131f; --panel2:#101b2c; --line:rgba(125,255,178,.22); --green:#7dffb2; --cyan:#22d3ee; --red:#ff4d6d; --amber:#facc15; --text:#dbe7f5; --muted:#7f93ad; font-family:'Segoe UI',system-ui,sans-serif; }
  * { box-sizing:border-box; }
  body { margin:0; background:radial-gradient(ellipse at 50% -10%, #0f2a2c, var(--bg) 60%); color:var(--text); min-height:100vh; padding-bottom:84px; }
  header { display:flex; align-items:center; gap:16px; padding:14px 24px; border-bottom:1px solid var(--line); background:rgba(4,8,14,.85); position:sticky; top:0; z-index:5; backdrop-filter:blur(6px); }
  header h1 { margin:0; font-size:18px; letter-spacing:.14em; } header h1 span { color:var(--green); }
  header .sp { flex:1; } header a, header button { color:var(--muted); text-decoration:none; font-size:13px; }
  button { font:inherit; color:inherit; background:rgba(20,34,52,.9); border:1px solid rgba(125,255,178,.28); border-radius:8px; padding:7px 14px; cursor:pointer; }
  button:hover { border-color:var(--green); } button.primary { background:linear-gradient(180deg,rgba(50,200,130,.4),rgba(20,110,80,.45)); border-color:var(--green); color:#eafff4; }
  button.danger { border-color:rgba(255,77,109,.5); color:#ffb4c0; } button.ghost { background:transparent; }
  main { max-width:1180px; margin:0 auto; padding:20px 24px; }
  .tabs { display:flex; gap:6px; margin-bottom:6px; flex-wrap:wrap; }
  .tabs button { border-radius:8px 8px 0 0; padding:9px 18px; font-size:13px; letter-spacing:.05em; text-transform:uppercase; }
  .tabs button.active { background:rgba(50,200,130,.22); border-color:var(--green); color:#fff; }
  .sub { margin-bottom:16px; } .sub button { font-size:12px; padding:5px 12px; border-radius:16px; }
  .note { color:var(--muted); font-size:13px; line-height:1.55; margin:0 0 14px; max-width:820px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:14px; }
  .card { background:var(--panel); border:1px solid rgba(127,147,173,.2); border-radius:12px; padding:14px 14px 12px; }
  .card.mod { border-color:rgba(250,204,21,.6); box-shadow:0 0 0 1px rgba(250,204,21,.15); }
  .card h3 { margin:0 0 10px; display:flex; align-items:center; gap:8px; font-size:14px; color:var(--green); }
  .card h3 small { color:var(--muted); font-weight:400; font-size:11px; margin-left:auto; } .card h3 .rs { padding:2px 8px; font-size:11px; }
  .fields { display:grid; grid-template-columns:1fr 1fr; gap:8px 10px; }
  .fields .wide { grid-column:1/-1; }
  label { display:flex; flex-direction:column; gap:3px; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  input, select { font:inherit; font-size:13px; letter-spacing:normal; text-transform:none; color:var(--text); background:#050a12; border:1px solid rgba(125,255,178,.22); border-radius:6px; padding:6px 8px; outline:none; width:100%; }
  input:focus, select:focus { border-color:var(--green); } label.mod input, label.mod select { border-color:var(--amber); background:#161305; }
  table { border-collapse:collapse; width:100%; background:var(--panel); border-radius:12px; overflow:hidden; }
  th, td { padding:8px 10px; text-align:left; border-bottom:1px solid rgba(127,147,173,.15); font-size:13px; }
  th { color:var(--muted); font-size:11px; letter-spacing:.08em; text-transform:uppercase; background:var(--panel2); }
  td input { width:84px; } td.mod input { border-color:var(--amber); background:#161305; }
  .badge { font-size:10px; letter-spacing:.1em; padding:2px 7px; border-radius:10px; border:1px solid rgba(250,204,21,.5); color:var(--amber); }
  .on { color:var(--green); } .off { color:var(--muted); } .bad { color:var(--red); } .badge.bad { border-color:rgba(255,77,109,.6); color:#ffb4c0; }
  #bar { position:fixed; left:0; right:0; bottom:0; display:flex; align-items:center; gap:12px; padding:14px 24px; background:rgba(4,8,14,.94); border-top:1px solid var(--line); z-index:6; }
  #bar .msg { flex:1; font-size:13px; color:var(--muted); } #bar .msg.ok { color:var(--green); } #bar .msg.err { color:var(--red); } #bar .msg.dirty { color:var(--amber); }
  #gate { max-width:460px; margin:14vh auto; text-align:center; padding:30px; background:var(--panel); border:1px solid var(--line); border-radius:14px; }
  [data-lang].on { background:rgba(50,200,130,.3); border-color:var(--green); color:#fff; } [data-lang] { padding:3px 9px; font-size:12px; }
  html[lang="th"] * { letter-spacing:0 !important; }
  body { font-family:'Segoe UI','Leelawadee UI','Noto Sans Thai',Tahoma,system-ui,sans-serif; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>NEON<span>ALERT</span> &nbsp;/&nbsp; ADMIN</h1><div class="sp"></div>
  <span id="who" class="note" style="margin:0"></span>
  <span id="langSwitch" translate="no" style="display:flex;gap:4px"><button type="button" data-lang="en">EN</button><button type="button" data-lang="th">ไทย</button></span>
  <a href="/">← Back to game</a>
</header>

<div id="gate" class="hidden"><h2 id="gateTitle">Admin only</h2><p class="note" id="gateMsg"></p><a href="/"><button class="primary">Go to sign in</button></a></div>

<main id="app" class="hidden">
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</main>

<div id="bar" class="hidden">
  <div class="msg" id="msg">No changes.</div>
  <button id="btnReset" class="danger">Reset all to defaults</button>
  <button id="btnDiscard" class="ghost">Discard edits</button>
  <button id="btnSave" class="primary">Save changes</button>
</div>

<script src="js/data.js"></script>
<script src="js/mapdata.js"></script>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/sim.js"></script>
<script src="js/mapeditor.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
